services:
  rustfs:
    container_name: rustfs
    image: docker.io/rustfs/rustfs:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - jevek_fs:/data

volumes:
  jevek_fs: