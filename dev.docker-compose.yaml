services:
  rustfs:
    container_name: rustfs
    image: rustfs/rustfs:latest
    restart: unless-stopped
    env_file:
      - .env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data

volumes:
  rustfs_data: